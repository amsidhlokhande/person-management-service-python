services:
  person-management-service:
    build: .
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-DEV}
      # Override the active profile's configured primary SQLite URL for persistent storage.
      DEV_PRIMARY_DATABASE_URL: sqlite:////app/data/person_management.db
      UAT_PRIMARY_DATABASE_URL: sqlite:////app/data/person_management_uat.db
      PROD_PRIMARY_DATABASE_URL: sqlite:////app/data/person_management_prod.db
    volumes:
      - person-data:/app/data
    networks:
      - person-service

  mtls-gateway:
    image: nginx:1.29-alpine
    depends_on:
      - person-management-service
    ports:
      - "8443:8443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/server.crt:/etc/nginx/tls/server.crt:ro
      - ./certs/server.key:/etc/nginx/tls/server.key:ro
      - ./certs/ca.crt:/etc/nginx/tls/ca.crt:ro
    networks:
      - person-service

volumes:
  person-data:

networks:
  person-service:
